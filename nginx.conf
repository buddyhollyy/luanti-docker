server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "no-cache, must-revalidate" always;

    location ~ ^/(mineclonia|index\.html)$ {
        try_files /index.html =404;
        sub_filter '</body>' '<script src="/maplink.js"></script></body>';
    }

    location = /mineclonia/ {
        return 301 /mineclonia;
    }

    location = /antichunk/world/map_meta.txt { alias /usr/share/nginx/world/map_meta.txt; }
    location = /antichunk/world/map.sqlite   { alias /usr/share/nginx/world/map.sqlite; }
    location = /maplink.js  { alias /usr/share/nginx/maplink/maplink.js; }
    location = /maplink.png { alias /usr/share/nginx/maplink/maplink.png; }

    location /antichunk/ {
        alias /usr/share/nginx/antichunk/;
        index index.html;
    }

    location = /world {
        return 301 /world/;
    }

    # Looked up per request, so the game site still starts if the world
    # page container is down.
    location /world/ {
        resolver 127.0.0.11 valid=10s;
        set $world world:8000;
        rewrite ^/world(/.*)$ $1 break;
        proxy_pass http://$world;
        client_max_body_size 4g;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        error_page 502 504 = @world_off;
    }

    location @world_off {
        default_type text/plain;
        return 503 "The world page is off. To turn it on, see \"The world page\" in the README.\n";
    }

    location /proxy {
        proxy_pass http://luanti:8888/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
