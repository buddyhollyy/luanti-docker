services:
  luanti:
    image: ghcr.io/luanti-org/luanti:5.16.1
    restart: unless-stopped
    command: --gameid mineclonia --config /etc/minetest/minetest.conf --world /var/lib/minetest/.minetest/worlds/world
    volumes:
      - ./config:/etc/minetest:ro
      - ./data:/var/lib/minetest
      - ./games:/var/lib/minetest/.minetest/games:ro
    ports:
      - "30000:30000/udp"

  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    restart: unless-stopped
    network_mode: "service:luanti"
    depends_on: [luanti]

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./www:/usr/share/nginx/html:ro
      - ./antichunk:/usr/share/nginx/antichunk:ro
      - ./maplink.js:/usr/share/nginx/maplink/maplink.js:ro
      - ./maplink.png:/usr/share/nginx/maplink/maplink.png:ro
      - ./data/.minetest/worlds/world:/usr/share/nginx/world:ro
    depends_on: [luanti]

  # Nightly world backups (README, "Nightly backups"). Reads the world,
  # writes only to the backup folder; uses the host's time zone.
  backup:
    image: python:3.14-alpine
    restart: unless-stopped
    command: ["python", "-u", "/app/backup-world", "--nightly"]
    environment:
      WORLD: /worlds/world
      BACKUP_DIR: /backups
      BACKUP_TIME: ${BACKUP_TIME:-04:00}
      KEEP_DAILY: ${KEEP_DAILY:-7}
      KEEP_WEEKLY: ${KEEP_WEEKLY:-4}
    volumes:
      - ./backup-world:/app/backup-world:ro
      - ./data/.minetest/worlds:/worlds:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - /etc/localtime:/etc/localtime:ro

  # The /world page. Off unless you turn it on (README, "The world page").
  # It can read the worlds and backups, and can only write to inbox/; the
  # root cron job world-inbox carries out what it asks for.
  world:
    profiles: [world]
    image: python:3.14-alpine
    restart: unless-stopped
    user: "30000:30000"
    command: ["python", "-u", "/app/service.py"]
    volumes:
      - ./worldpage:/app:ro
      - ./data/.minetest/worlds:/worlds:ro
      - ${BACKUP_DIR:-./backups}:/backups:ro
      - ./inbox:/inbox
